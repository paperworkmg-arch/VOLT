services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.base44.backend
    working_dir: /app/app/dashboard
    volumes:
      - .:/app
    command: ["sh", "-ec", "python seed_catalog.py && exec uvicorn omni:app --host 0.0.0.0 --port 8500 --reload"]
    env_file:
      - /run/base44/app.env
    environment:
      - OMNI_HOST=0.0.0.0
      - OMNI_PORT=8500
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8500/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: on-failure

  web:
    image: node:22
    working_dir: /app/app/volt-dashboard
    volumes:
      - .:/app
    command: ["sh", "-ec", "npm install && exec npm run dev"]
    environment:
      - API_PROXY_TARGET=http://backend:8500
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: on-failure
